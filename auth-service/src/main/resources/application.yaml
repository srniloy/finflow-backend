spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show:sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8086

account:
  service:
    url: http://localhost:8081

auth:
  jwt:
    # HS256 secret shared with the api-gateway. Override with env var JWT_SECRET in production.
    secret: ${JWT_SECRET:finflow-dev-jwt-secret-please-change-me-0123456789}
    # Token / session validity: 60 minutes - banking session should be short-lived.
    ttl-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          /api/**:
            allowedOriginPatterns: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      routes:

        # Auth service routes (public - register/login, no JWT required)
        - id: auth-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/auth,/api/v1/auth/**

        # Account service routes
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts,/api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # Transaction service routes
        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # Payment service routes
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10

api:
  jwt:
    # HS256 secret shared with the auth-service. Override with env var JWT_SECRET in production.
    secret: ${JWT_SECRET:finflow-dev-jwt-secret-please-change-me-0123456789}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway


